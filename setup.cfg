[metadata]
name = bio-oncograph
version = attr: bio_oncograph.__version__.__version__
description = A Comprehensive Biomedical Knowledge Graph Framework for Oncology
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache License 2.0

[options]
packages = find:
python_requires = >=3.9

[options.entry_points]
console_scripts =
    bio-oncograph = bio_oncograph.cli:cli

[flake8]
max-line-length = 88
extend-ignore = E203
exclude = .git,__pycache__,build,dist
