[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-oncograph"
version = "2.0.0"
description = "A Comprehensive Biomedical Knowledge Graph Framework for Oncology"
readme = "README.md"
authors = [
    { name = "BioOncoGraph Contributors", email = "maintainers@bio-oncograph.org" }
]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["knowledge-graph", "oncology", "gnn", "biomedical"]
dependencies = [
    "numpy",
    "pandas",
    "torch>=2.0.0",
    "networkx",
    "click"
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "pre-commit"
]

[project.scripts]
bio-oncograph = "bio_oncograph.cli:cli"
